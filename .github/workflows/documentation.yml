name: Build Documentation

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  generate-docs:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Swift
        # This action ensures Swift 5.6+ is installed and on PATH
        uses: swift-actions/setup-swift@v1
        with:
          swift-version: "5.9" # you can pick 5.6, 5.7, 5.8, 5.9 etc.

      - name: Build documentation
        run: swift package generate-documentation --target Permissions
